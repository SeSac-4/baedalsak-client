# =============================================================================
# 인프라 레포에 배포 알림 (baedalsak-client)
#
#   develop push(머지) → <owner>/baedalsak-infra 에 repository_dispatch(client-updated, sha)
#   → 인프라 레포 "프론트 배포" 가 이 커밋을 빌드해 S3 에 올리고 CloudFront 캐시 무효화
#
#   필요: 레포 Secret INFRA_DISPATCH_TOKEN
#         fine-grained PAT, 대상 레포 baedalsak-infra, 권한 Contents: Read and write
# =============================================================================
name: notify-infra

on:
  push:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**"] # 문서만 바뀌면 다시 배포할 필요 없음

permissions: {}

jobs:
  notify:
    name: 인프라 레포에 알림
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::레포 Secret INFRA_DISPATCH_TOKEN 이 없습니다"; exit 1; fi
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/baedalsak-infra/dispatches" \
            -f event_type=client-updated -f "client_payload[sha]=$SHA"
          echo "### 인프라 레포에 알림: \`$SHA\` → 프론트 배포는 baedalsak-infra Actions 에서 확인" >> "$GITHUB_STEP_SUMMARY"
